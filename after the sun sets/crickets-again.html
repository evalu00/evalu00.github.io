<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <title>After the Sun Sets</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body style="background-color: #10151E;">

  <main class="page">

    <!-- audio ! -->

    <audio id="background-sound" autoplay loop>
      <source src="sounds/crickets.mp3" type="audio/mpeg">
    </audio>


    <!-- back button ! -->

    <button class="retrace" type="button">
      ← Retrace Your Steps
    </button>


    <!-- text ! -->

    <section class="story">

      <div class="star">
        <span></span>
        <span></span>
        <span></span>
       <span></span>
       <span></span>
     </div>

      <p>The same crickets are still chirping.</p>

      <p>You hadn't noticed how constant<br>
      their sound was until you listened<br>
      to everything else.</p>

      <p>The air has grown cooler. A porch light<br>
      glows across the street.</p>

    </section>


    <!-- buttons ! -->

    <nav class="choices">

      <div class="choice-area" data-side="left">
        <a href="owl.html" class="choice">
          An Echo Above
        </a>

        <img src="watercolor-assets/an-echo-above.png"
        class="hover-image">

      </div>

      <div class="choice-area" data-side="right">
        <a href="home.html" class="choice">
          Head Home
        </a>

        <img src="watercolor-assets/head-home.png"
        class="hover-image">

      </div>

    </nav>


    <!-- sound button ! -->

    <button class="sound-label" type="button">
      PLAY SOUND
    </button>

  </main>

</html>
