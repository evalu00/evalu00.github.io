<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>After the Sun Sets</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body style="background-color: #161A1F;">

  <main class="page">

    <!-- audio ! -->

    <audio id="background-sound" autoplay loop>
      <source src="sounds/crickets.mp3" type="audio/mpeg">
    </audio>


    <!-- back button ! -->

    <button class="retrace" type="button">
      ← Retrace Your Steps
    </button>


    <!-- text ! -->

    <section class="story">

      <div class="star">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <p>The crickets are already awake.</p>

      <p>Their chirping rises from the grass,<br>
      following you past driveways<br>
      and neatly trimmed hedges.</p>

      <p>A breeze carries the faint smell<br>
      of fresh laundry from an open window.</p>

      <p>You slow your steps to listen.</p>

    </section>


    <!-- buttons ! -->

    <nav class="choices">

      <div class="choice-area" data-side="left">
        <a href="wind.html" class="choice">
          Rustling Above
        </a>

        <img src="watercolor-assets/rustling.png"
        class="hover-image">

      </div>

      <div class="choice-area" data-side="right">
        <a href="owl.html" class="choice">
          A Distant Call
        </a>

        <img src="watercolor-assets/an-echo-above.png"
        class="hover-image">

      </div>

    </nav>


    <!-- sound button ! -->

    <button class="sound-label" type="button">
      PLAY SOUND
    </button>

  </main>

</body>
</html
