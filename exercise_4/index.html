<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title>letters</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      background-color: #e5e5e5;
    }

    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 90px;
      width: 100%;
      padding: 50px 0;
    }

    .letter {
      position: relative;
      overflow: visible;
    }

    .n1 {
      width: 190px;
      height: 200px;
    }

    .n2 {
      width: 235px;
      height: 290px;
    }

    .n3 {
      transform: scale(1.3);
      width: 196px;
      height: 164px;
      margin: 25px 0;
    }

    .n4 {
     width: 220px;
     height: 238px;
    }

    .n5 {
      transform: scale(1.4);
      width: 154px;
      height: 154px;
      margin: 25px 0;
    }

    .vertical {
      position: absolute;
      left: 150px;
      top: 70px;
      width: 40px;
      height: 130px;
      background-color: #99918b;
      opacity: 0.5;
    }

    .vertical2 {
      position: absolute;
      left: 0;
      top: 0;
      width: 40px;
      height: 200px;
      background-color: #99918b;
      opacity: 0.7;
    }

    .semi-circle {
      position: absolute;
      width: 110px;
      height: 50px;
      border: 40px solid #99918b;
      border-bottom: 0;
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      opacity: 0.8;
    }

    .semi-circle2 {
      position: absolute;
      width: 100px;
      height: 50px;
      border: 40px solid #414c4a;
      border-bottom: 0;
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    }

    .semi-filled {
     position: absolute;
     width: 120px;
     height: 35px;
     background-color: #618988;
     border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    }

    .sc1 {
      position: absolute;
      left: 34px
    }

    .sc2 { 
      position: absolute;
      transform: scaleX(1.1) rotate(-90deg);
      top: 77px;
      left: -44px;
    }

    .v1 {
     position: absolute;
     left: 114px;
     opacity: 100%;
     transform: scaleY(0.93);
     background-color: #618988;
     top: 29px;
    }

    .ellipse-left {
      position: absolute;
      left: 0;
      top: 90px;
      width: 100px;
      height: 200px;
      background-color: #aac4c5;
      border-radius: 50px;
    }

    .ellipse-right {
      position: absolute;
      left: 135px;
      top: 30px;
      width: 100px;
      height: 260px;
      background-color: #aac4c5;
      border-radius: 50px;
      opacity: 0.8;
    }

    .semi-circle2 {
      position: absolute;
      width: 140px;
      height: 35px;
      border: 40px solid #aac4c5;
      border-bottom: 0;
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      opacity: 0.65;
    }

    .vertical3 {
      position: absolute;
      top: 70px;
      width: 40px;
      height: 80px;
      background-color: #aac4c5;
    }

    .square {
      position: absolute;
      width: 35px;
      height: 35px;
      background-color: #74ccd2;
    }

    .s1 {
      left: 0;
      top: 28px;
      border-radius: 8px;
    }

    .s2 {
      left: 28px;
      top: 0;
      border-radius: 8px 0 0 8px;
    }

    .s3 {
      left: 63px;
      top: 0;
      border-radius: 0 8px 0 0;
    }

    .s4 {
      left: 63px;
      top: 35px;
    }

    .s5 {
      left: 63px;
      top: 70px;
      border-radius: 0 0 8px 3px;
    }

    .s6 {
      left: 28px;
      top: 94px;
      border-radius: 8px 3px 0 0;
    }

    .s7 {
      left: 28px;
      top: 129px;
      border-radius: 0 0 8px 0;
    }

    .s8 {
      left: 0;
      top: 129px;
      border-radius: 8px 0 0 8px;
    }

    .s9 {
      left: 98px;
      top: 35px;
      border-radius: 0 4px 4px 0;
    }

    .s10 {
      left: 126px;
      top: 1px;
      border-radius: 4px 0 0 4px;
    }

    .s11 {
      left: 161px;
      top: 1px;
      border-radius: 0 8px 0 0;
    }

    .s12 {
      left: 161px;
      top: 36px;
    }

    .s13 {
      left: 161px;
      top: 71px;
      border-radius: 0 0 8px 8px;
    }

    .s14 {
      left: 130px;
      top: 96px;
      border-radius: 8px 8px 0 0;
    }

    .s15 {
      left: 130px;
      top: 129px;
      border-radius: 0 0 8px 8px;
    }

    .s16 {
      left: 161px;
      top: 129px;
      border-radius: 0 8px 8px 0;
    }

    .s2_1 {
      background-color: #618988;
    }

    .n4-ellipse {
      position: absolute;
      width: 50px;
      height: 200px;
      background-color: #414c4a;
      border-radius: 20px;
    }

    .n4-left {
      left: 0;
      top: 38px;
    }

    .n4-right {
      left: 170px;
      top: 38px;
    }

    .n4-horizontal {
      position: absolute;
      left: 35px;
      top: 0;
      width: 150px;
      height: 50px;
      background-color: #414c4a;
      border-radius: 20px;
    }
  </style>
</head>

<body>
  <div class="main">
    <div class="letter n1">
      <div class="vertical"></div>
      <div class="vertical2"></div>
      <div class="semi-circle"></div>
    </div>

    <div class="letter n2">
      <div class="ellipse-left"></div>
      <div class="ellipse-right"></div>
      <div class="semi-circle2"></div>
      <div class="vertical3"></div>
    </div>

    <div class="letter n3">
      <div class="square s1"></div>
      <div class="square s2"></div>
      <div class="square s3"></div>
      <div class="square s4"></div>
      <div class="square s5"></div>
      <div class="square s6"></div>
      <div class="square s7"></div>
      <div class="square s8"></div>
      <div class="square s9"></div>
      <div class="square s10"></div>
      <div class="square s11"></div>
      <div class="square s12"></div>
      <div class="square s13"></div>
      <div class="square s14"></div>
      <div class="square s15"></div>
      <div class="square s16"></div>
    </div>

    <div class="letter n4">
      <div class="n4-ellipse n4-left"></div>
      <div class="n4-ellipse n4-right"></div>
      <div class="n4-horizontal"></div>
    </div>

    <div class="letter n5">
      <div class="square s2_1"></div>
      <div class="semi-filled sc1"></div>
      <div class="semi-filled sc2"></div>
      <div class="vertical v1"></div>
    </div>
 
</div>
</body>
</html>
