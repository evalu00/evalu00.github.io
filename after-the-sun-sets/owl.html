      <p>A low call drifts over the rooftops.</p>

      <p>You look toward the trees,<br>
      but the branches are lost in the dark.</p>

      <p>Above them, a few stars are visible<br>
      and you make out a few constellations.</p>

      <p>The call comes again.<br>
      It's nice to know something else<br>
      is keeping you company.</p>
