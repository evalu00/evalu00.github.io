<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <title>letter n</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background-color: #e5e5e5;
    }

    .main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 90px;
      width: 100%;
      min-height: 100vh;
      padding: 50px 0;
    }

    .letter {
      position: relative;
      overflow: visible;
    }

    .n3 {
      transform: scale(1.3);
      width: 196px;
      height: 164px;
      margin: 180px 0;
    }

    .square {
      position: absolute;
      width: 35px;
      height: 35px;
      background-color: #74ccd2;

      transition: border-radius 0.3s ease, transform 0.4s ease;
    }

    .square:hover {
      border-radius: 50%;
      transform: scale(0.5);
    }

    .s1 {
      left: 0;
      top: 28px;
      border-radius: 8px;
    }

    .s2 {
      left: 28px;
      top: 0;
      border-radius: 8px 0 0 8px;
    }

    .s3 {
      left: 63px;
      top: 0;
      border-radius: 0 8px 0 0;
    }

    .s4 {
      left: 63px;
      top: 35px;
    }

    .s5 {
      left: 63px;
      top: 70px;
      border-radius: 0 0 8px 3px;
    }

    .s6 {
      left: 28px;
      top: 94px;
      border-radius: 8px 3px 0 0;
    }

    .s7 {
      left: 28px;
      top: 129px;
      border-radius: 0 0 8px 0;
    }

    .s8 {
      left: 0;
      top: 129px;
      border-radius: 8px 0 0 8px;
    }

    .s9 {
      left: 98px;
      top: 35px;
      border-radius: 0 4px 4px 0;
    }

    .s10 {
      left: 126px;
      top: 1px;
      border-radius: 4px 0 0 4px;
    }

    .s11 {
      left: 161px;
      top: 1px;
      border-radius: 0 8px 0 0;
    }

    .s12 {
      left: 161px;
      top: 36px;
    }

    .s13 {
      left: 161px;
      top: 71px;
      border-radius: 0 0 8px 8px;
    }

    .s14 {
      left: 130px;
      top: 96px;
      border-radius: 8px 8px 0 0;
    }

    .s15 {
      left: 130px;
      top: 129px;
      border-radius: 0 0 8px 8px;
    }

    .s16 {
      left: 161px;
      top: 129px;
      border-radius: 0 8px 8px 0;
    }

  </style>
</head>

<body>
  <div class="main">

    <div class="letter n3">
      <div class="square s1"></div>
      <div class="square s2"></div>
      <div class="square s3"></div>
      <div class="square s4"></div>
      <div class="square s5"></div>
      <div class="square s6"></div>
      <div class="square s7"></div>
      <div class="square s8"></div>
      <div class="square s9"></div>
      <div class="square s10"></div>
      <div class="square s11"></div>
      <div class="square s12"></div>
      <div class="square s13"></div>
      <div class="square s14"></div>
      <div class="square s15"></div>
      <div class="square s16"></div>
    </div>

</div>
</body>
</html>
